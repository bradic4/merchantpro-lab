<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava | MerchantPro Lab</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --card-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 1.2rem;
    }
    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: #090d16;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.99); }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
    .hint-box {
      margin-top: 1.75rem;
      padding: 1rem;
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .hint-box code {
      color: var(--accent);
      background: #090d16;
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <div class="brand-logo">M</div>
      <div>
        <div class="brand-title">MerchantPro Lab</div>
        <div class="brand-subtitle">Commercial Operations & Telemetry</div>
      </div>
    </div>

    <div id="errorAlert" class="alert alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail adresa</label>
        <input type="email" id="email" required placeholder="admin@merchantpro.lab" autofocus>
      </div>

      <div class="form-group">
        <label for="password">Lozinka</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn" id="submitBtn">Prijavite se</button>
    </form>

    <div class="hint-box">
      <strong>Demo nalozi za test:</strong><br>
      • <strong>Admin:</strong> <code>admin@merchantpro.lab</code> / <code>admin123</code><br>
      • <strong>Klijent:</strong> <code>client@volimsvojdom.rs</code> / <code>client123</code>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Provera...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: passwordInput.value
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Greška pri prijavi');
        }

        // Save token to localStorage as backup / API client
        if (data.token) {
          localStorage.setItem('sd_token', data.token);
        }

        // Redirect based on role
        if (data.user && data.user.role === 'ADMIN') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/dashboard';
        }
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Prijavite se';
      }
    });
  </script>
</body>
</html>
